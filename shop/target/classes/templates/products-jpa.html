<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Товары (JPA)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    .actions a { margin-right: 10px; }
    .actions button { cursor: pointer; }
  </style>
</head>
<body>
<h1>Список товаров (через JPA)</h1>
<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Название</th>
    <th>Цена</th>
    <th>Остаток</th>
    <th>Категория</th>
    <th>Производитель</th>
    <th>Ед. изм.</th>
    <th>Действия</th>
  </tr>
  </thead>
  <tbody>

  <tr th:each="p : ${products}">

    <td th:text="${p.id}"></td>
    <td th:text="${p.title}"></td>
    <td th:text="${p.cost}"></td>
    <td th:text="${p.quantityInStock}"></td>
    <td th:text="${p.category != null ? p.category.title : '—'}"></td>
    <td th:text="${p.manufacturer != null ? p.manufacturer.title : '—'}"></td>
    <td th:text="${p.unitType != null ? p.unitType.title : '—'}"></td>

    <td class="actions">
      <a th:href="@{/admin/products/edit/{id}(id=${p.id})}">Редактировать</a>
      <form th:action="@{/admin/products/delete/{id}(id=${p.id})}" method="post" style="display:inline">
        <button type="submit" onclick="return confirm('Удалить товар?')">Удалить</button>
      </form>
    </td>
  </tr>

  </tbody>
</table>
</body>
</html>
